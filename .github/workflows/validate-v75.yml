name: Validar versão técnica

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-technical-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-technical:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Gerar e testar o sistema completo
        run: npm test

      - name: Confirmar artefatos consolidados atualizados
        run: |
          git diff --exit-code -- \
            app-runtime-v75.js \
            styles-runtime-v75.css \
            modals-core-runtime-v75.js \
            modals-runtime-v75.js \
            nova-venda-runtime-v75.js \
            aba-clientes-runtime-v75.js \
            customer-history-runtime-v75.js
