name: Validar v65

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-v65:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validar sintaxe dos módulos novos
        run: |
          node --check reports-engine-v65.js
          node --check aba-relatorios-v65.js
          node --check sale-pdf-v65.js
          node --check modals-fixed-v65.js
          node --check nova-venda-fixed-v65.js
          node --check app-patch-sale-pdf-v65.js
          node --check app-patch-reports-v65.js
          node --check app-patch-final-v65.js
          node --check bootstrap-v65.js
      - name: Validar estrutura dos relatórios
        run: |
          grep -q "Crediário e inadimplência" reports-engine-v65.js
          grep -q "Pagamentos atrasados no período" reports-engine-v65.js
          grep -q "Atrasou e pagou" reports-engine-v65.js
          grep -q "Comportamento dos clientes" reports-engine-v65.js
          grep -q "Taxas de cartão" reports-engine-v65.js
          grep -q "discountReason" reports-engine-v65.js
          grep -q "Motivo do cancelamento" reports-engine-v65.js
      - name: Validar PDFs de venda
        run: |
          grep -q "DOCUMENTO NÃO FISCAL" sale-pdf-v65.js
          grep -q "PARCELAS" sale-pdf-v65.js
          grep -q "navigator.share" sale-pdf-v65.js
          grep -q "onGeneratePdf" app-patch-sale-pdf-v65.js
          grep -q "Compartilhar PDF" modals-fixed-v65.js
      - name: Validar motivo de desconto
        run: |
          grep -q "Motivo do desconto" nova-venda-fixed-v65.js
          grep -q "discountReason" nova-venda-fixed-v65.js
      - name: Validar versão ativa
        run: |
          grep -q "bootstrap-v65.js?v=65" index.html
          grep -q "aba-relatorios-v65.js?v=65" bootstrap-v65.js
          grep -q "modals-fixed-v65.js?v=65" bootstrap-v65.js
          grep -q "nova-venda-fixed-v65.js?v=65" bootstrap-v65.js
