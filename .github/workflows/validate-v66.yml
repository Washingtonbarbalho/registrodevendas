name: Validar v67

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-v67:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validar sintaxe dos módulos v67
        run: |
          node --check aba-financeiro-v67.js
          node --check aba-produtos-v67.js
          node --check batch-stock-modal-v67.js
          node --check app-patch-batch-stock-v67.js
          node --check app-patch-final-v67.js
          node --check bootstrap-v67.js
          node --check scripts/validate-v67.mjs
      - name: Validar montagem completa do aplicativo
        run: |
          node scripts/validate-v67.mjs
          node --check /tmp/registro-vendas-runtime-v67.mjs
      - name: Validar estoque em lote
        run: |
          grep -q "writeBatch" batch-stock-modal-v67.js
          grep -q "batchId" batch-stock-modal-v67.js
          grep -q "batchTotal" batch-stock-modal-v67.js
          grep -q "O Financeiro receberá um único lançamento" batch-stock-modal-v67.js
          grep -q "Compra de mercadoria em lote" aba-financeiro-v67.js
          grep -q "purchaseItems" aba-financeiro-v67.js
      - name: Validar filtros de contas
        run: |
          grep -q "item.dueDate >= startDate && item.dueDate <= endDate" aba-financeiro-v67.js
          grep -q "finance67-account-tools" aba-financeiro-v67.js
          grep -q "Contas a receber" aba-financeiro-v67.js
          grep -q "Contas a pagar" aba-financeiro-v67.js
      - name: Validar preservação do menu mobile
        run: |
          grep -q "applyMobileMenuPatch" bootstrap-v67.js
          grep -q "inset: 72px 0 0" v66-mobile-menu.css
      - name: Validar versão ativa
        run: |
          grep -q "v67-batch-stock.css?v=67" index.html
          grep -q "bootstrap-v67.js?v=67" index.html
          grep -q "aba-financeiro-v67.js?v=67" bootstrap-v67.js
          grep -q "batch-stock-modal-v67.js?v=67" bootstrap-v67.js
