name: Aplicar recursos finais

on:
  push:
    branches:
      - main
    paths:
      - scripts/apply_final_features.py

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar alterações
        run: python3 scripts/apply_final_features.py

      - name: Verificar sintaxe JavaScript
        shell: bash
        run: |
          set -e
          for arquivo in app.js nova-venda.js modals.js auth-admin.js aba-clientes.js utils.js draft-storage.js; do
            echo "Verificando $arquivo"
            node --input-type=module --check < "$arquivo"
          done

      - name: Publicar alterações
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js nova-venda.js modals.js auth-admin.js aba-clientes.js utils.js index.html
          git commit -m "Adiciona rascunhos e controle manual de crédito"
          git push
