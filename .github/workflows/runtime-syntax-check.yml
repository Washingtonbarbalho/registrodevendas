name: Runtime syntax check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate active runtime
        run: node scripts/validate-runtime-build.mjs
