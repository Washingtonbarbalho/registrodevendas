name: Verificação de sintaxe

on:
  push:
    branches:
      - main
      - correcao-sintaxe-cartao-v39
  pull_request:

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verificar todos os arquivos JavaScript
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' arquivo; do
            echo "Verificando $arquivo"
            node --input-type=module --check < "$arquivo"
          done < <(find . -type f -name '*.js' -not -path './node_modules/*' -print0)

      - name: Verificar JavaScript embutido no index.html
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, re
          html = pathlib.Path('index.html').read_text(encoding='utf-8')
          blocos = re.findall(r'<script\s+type="module">(.*?)</script>', html, flags=re.S)
          if not blocos:
              raise SystemExit('Nenhum script type="module" encontrado em index.html')
          pathlib.Path('/tmp/index-module.mjs').write_text('\n'.join(blocos), encoding='utf-8')
          PY
          node --check /tmp/index-module.mjs
