<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Registro de Vendas</title>

    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Vendas App">

    <link rel="manifest" href="./manifest.json?v=15">
    <link rel="icon" type="image/svg+xml" href="./app-icon.svg?v=15">
    <link rel="apple-touch-icon" href="./app-icon.svg?v=15">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./styles.css?v=46">
    <link rel="stylesheet" href="./modals-theme.css?v=46">
    <link rel="stylesheet" href="./ui-refinements.css?v=46">
    <link rel="stylesheet" href="./final-tweaks.css?v=46">
    <link rel="stylesheet" href="./v21-improvements.css?v=46">
    <link rel="stylesheet" href="./v23-fixes.css?v=46">
    <link rel="stylesheet" href="./v25-fixes.css?v=46">
    <link rel="stylesheet" href="./v26-fixes.css?v=46">
    <link rel="stylesheet" href="./v27-fixes.css?v=46">
    <link rel="stylesheet" href="./v29-entry-rules.css?v=46">
    <link rel="stylesheet" href="./v30-entry-rule-visibility.css?v=46">
    <link rel="stylesheet" href="./v31-dashboard.css?v=46">
    <link rel="stylesheet" href="./v44-financeiro.css?v=46">
    <link rel="stylesheet" href="./v46-financeiro.css?v=46">
</head>
<body>
    <div id="root"></div>

    <script type="module">
        const root = document.getElementById('root');

        const showStartupError = (error) => {
            console.error('Erro ao iniciar o sistema:', error);
            root.innerHTML = `
                <main style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#f8fafc;font-family:Inter,Arial,sans-serif">
                    <section style="width:100%;max-width:520px;background:white;border:1px solid #e2e8f0;border-radius:20px;padding:24px;box-shadow:0 16px 45px rgba(15,23,42,.10)">
                        <h1 style="margin:0 0 10px;color:#0f172a;font-size:22px">Não foi possível iniciar o sistema</h1>
                        <p style="margin:0 0 16px;color:#64748b;line-height:1.5">Um arquivo do sistema não carregou corretamente. Atualize a página. Se continuar, confira se todos os arquivos do pacote foram colocados na mesma pasta do <strong>index.html</strong>.</p>
                        <button onclick="location.reload()" style="border:0;border-radius:12px;background:#0f172a;color:white;font-weight:700;padding:12px 16px;width:100%">Tentar novamente</button>
                        <pre style="white-space:pre-wrap;margin:16px 0 0;padding:12px;border-radius:12px;background:#f1f5f9;color:#b91c1c;font-size:11px;overflow:auto">${String(error?.message || error || 'Erro desconhecido').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}</pre>
                    </section>
                </main>`;
        };

        try {
            const cleanupKey = 'registro-vendas-cleanup-v46';
            if (sessionStorage.getItem(cleanupKey) !== 'ok') {
                if ('serviceWorker' in navigator) {
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    await Promise.all(registrations.map(registration => registration.unregister()));
                }
                if ('caches' in window) {
                    const cacheNames = await caches.keys();
                    await Promise.all(cacheNames.map(cacheName => caches.delete(cacheName)));
                }
                sessionStorage.setItem(cleanupKey, 'ok');

                if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
                    location.reload();
                    await new Promise(() => {});
                }
            }

            const version = '46';
            const appResponse = await fetch(`./app.js?v=${version}`, { cache: 'no-store' });
            if (!appResponse.ok) throw new Error(`Falha ao carregar app.js (${appResponse.status})`);

            let appSource = await appResponse.text();

            const iconImportMarker = "import { Users, User, LogOut, Lock, LayoutDashboard, Receipt, WalletCards, Package, Contact, Store, ShieldCheck, BadgePercent } from 'https://esm.sh/lucide-react@0.292.0';";
            const financeImportMarker = "import { AbaTaxas } from './aba-taxas.js';";
            const financeNavMarker = "        { id: 'rates', label: 'Taxas e juros', shortLabel: 'Taxas', icon: BadgePercent }";
            const financeRenderMarker = "                    : React.createElement(AbaTaxas, {";
            const stockModalImportMarker = `    ConfirmModal, WhatsAppChooserModal, ProductModal, StockMovementModal
} from './modals.js?v=4';`;
            const movementMarker = `        const newMovement = {
            id: Date.now().toString(),
            type: movType,
            quantity: movQty,
            unitCost: isEntry && movType === 'compra' ? movCost : 0,
            date: new Date().toISOString(),
            previousQty: currentQty,
            newQty: newQty,
            notes: movementInfo.notes || ''
        };`;
            const privateProfileMarker = "        const { paymentSettings: ignoredSettings, paymentSettingsUpdatedAt: ignoredSettingsDate, ...profileData } = updatedData;";
            const publicProfileMarker = "                        const { paymentSettings: ignoredSettings, paymentSettingsUpdatedAt: ignoredSettingsDate, ...publicProfile } = profileSnap.data();";

            if (!appSource.includes(iconImportMarker) || !appSource.includes(financeImportMarker) || !appSource.includes(financeNavMarker) || !appSource.includes(financeRenderMarker)) {
                throw new Error('Não foi possível integrar a aba Financeiro.');
            }
            if (!appSource.includes(stockModalImportMarker)) {
                throw new Error('Não foi possível integrar a forma de pagamento das compras de estoque.');
            }
            if (!appSource.includes(movementMarker)) {
                throw new Error('Não foi possível registrar os dados financeiros da compra de mercadoria.');
            }
            if (!appSource.includes(privateProfileMarker) || !appSource.includes(publicProfileMarker)) {
                throw new Error('Não foi possível proteger os dados privados do Financeiro.');
            }

            appSource = appSource.replace(
                iconImportMarker,
                "import { Users, User, LogOut, Lock, LayoutDashboard, Receipt, WalletCards, Package, Contact, Store, ShieldCheck, BadgePercent, Banknote } from 'https://esm.sh/lucide-react@0.292.0';"
            );
            appSource = appSource.replace(
                financeImportMarker,
                financeImportMarker + "\nimport { AbaFinanceiro } from './aba-financeiro.js';"
            );
            appSource = appSource.replace(
                financeNavMarker,
                "        { id: 'finance', label: 'Financeiro', shortLabel: 'Fin.', icon: Banknote },\n" + financeNavMarker
            );
            appSource = appSource.replace(
                financeRenderMarker,
                `                    : view === 'finance' ? React.createElement(AbaFinanceiro, {
                        userId: user.uid,
                        sales: sales,
                        products: products,
                        onOpenSale: sale => setSelectedSaleDetail(sale)
                    })
                    : React.createElement(AbaTaxas, {`
            );
            appSource = appSource.replace(
                stockModalImportMarker,
                `    ConfirmModal, WhatsAppChooserModal, ProductModal
} from './modals.js?v=4';
import { StockMovementModal } from './stock-movement-modal-v44.js';`
            );
            appSource = appSource.replace(
                movementMarker,
                `        const movementDate = new Date().toISOString();
        const purchasePaymentMethod = movType === 'compra' ? (movementInfo.paymentMethod || 'pix') : null;
        const purchaseDeferred = movType === 'compra' && (purchasePaymentMethod === 'credit' || purchasePaymentMethod === 'term');
        const newMovement = {
            id: Date.now().toString(),
            type: movType,
            quantity: movQty,
            unitCost: isEntry && movType === 'compra' ? movCost : 0,
            date: movementDate,
            previousQty: currentQty,
            newQty: newQty,
            notes: movementInfo.notes || '',
            paymentMethod: purchasePaymentMethod,
            paymentDueDate: purchaseDeferred ? (movementInfo.paymentDueDate || null) : null,
            financialPaid: movType === 'compra' ? !purchaseDeferred : null,
            financialPaidAt: movType === 'compra' && !purchaseDeferred ? movementDate.split('T')[0] : null
        };`
            );
            appSource = appSource.replace(
                privateProfileMarker,
                "        const { paymentSettings: ignoredSettings, paymentSettingsUpdatedAt: ignoredSettingsDate, financialData: ignoredFinancialData, financialUpdatedAt: ignoredFinancialDate, ...profileData } = updatedData;"
            );
            appSource = appSource.replace(
                publicProfileMarker,
                "                        const { paymentSettings: ignoredSettings, paymentSettingsUpdatedAt: ignoredSettingsDate, financialData: ignoredFinancialData, financialUpdatedAt: ignoredFinancialDate, ...publicProfile } = profileSnap.data();"
            );

            const freshModules = [
                'modals', 'auth-admin', 'nova-venda', 'aba-visao-geral',
                'aba-vendas-prazo', 'aba-vendas-caixa', 'aba-produtos', 'aba-clientes',
                'aba-financeiro', 'stock-movement-modal-v44', 'aba-taxas', 'payment-settings', 'utils'
            ];
            const fixedModulePaths = {
                'modals': './modals-fixed.js',
                'nova-venda': './nova-venda-fixed-v40.js',
                'aba-visao-geral': './aba-visao-geral-fixed.js',
                'aba-clientes': './aba-clientes-fixed.js'
            };

            appSource = appSource.replace(
                /(['"])(\.\/[^'"]+?\.js)(?:\?[^'"]*)?\1/g,
                (match, quote, modulePath) => {
                    const moduleName = modulePath.split('/').pop().replace(/\.js$/, '');
                    const resolvedModulePath = fixedModulePaths[moduleName] || modulePath;
                    const moduleUrl = new URL(resolvedModulePath, location.href);
                    if (freshModules.includes(moduleName)) moduleUrl.search = `?v=${version}`;
                    return `'${moduleUrl.href}'`;
                }
            );

            const productSortingMarker = `    const sortedProducts = useMemo(() => {
        const list = [...products].sort((a, b) => a.code.localeCompare(b.code));
        if (!productSearch) return list;
        return list.filter(p => p.name.toLowerCase().includes(productSearch.toLowerCase()) || p.code.includes(productSearch));
    }, [products, productSearch]);`;

            if (!appSource.includes(productSortingMarker)) {
                throw new Error('Não foi possível aplicar a nova organização da lista de produtos.');
            }

            const productSortingByStock = `    const sortedProducts = useMemo(() => {
        const compareProducts = (a, b) => {
            const aHasStock = (Number(a.quantity) || 0) > 0;
            const bHasStock = (Number(b.quantity) || 0) > 0;
            if (aHasStock !== bHasStock) return aHasStock ? -1 : 1;
            return String(a.name || '').localeCompare(String(b.name || ''), 'pt-BR', { sensitivity: 'base' });
        };
        const list = [...products].sort(compareProducts);
        if (!productSearch) return list;
        const search = productSearch.toLowerCase();
        return list.filter(p => String(p.name || '').toLowerCase().includes(search) || String(p.code || '').includes(productSearch));
    }, [products, productSearch]);`;

            appSource = appSource.replace(productSortingMarker, productSortingByStock);

            appSource = appSource.replace(
                "title: installmentListModal.type === 'overdue' ? 'Parcelas em atraso' : 'Vencendo em 7 dias'",
                "title: installmentListModal.type === 'overdue' ? 'Parcelas em atraso' : installmentListModal.type === 'today' ? 'Parcelas vencendo hoje' : 'Parcelas a vencer nos próximos 7 dias'"
            );

            const appBlobUrl = URL.createObjectURL(new Blob([appSource], { type: 'text/javascript' }));
            try {
                await import(appBlobUrl);
                await import('./tab-persistence.js?v=46');
            } finally {
                URL.revokeObjectURL(appBlobUrl);
            }
        } catch (error) {
            showStartupError(error);
        }
    </script>
</body>
</html>
