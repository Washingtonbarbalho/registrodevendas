<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Registro de Vendas</title>

    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Vendas App">

    <link rel="manifest" href="./manifest.json?v=15">
    <link rel="icon" type="image/svg+xml" href="./app-icon.svg?v=15">
    <link rel="apple-touch-icon" href="./app-icon.svg?v=15">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./styles.css?v=40">
    <link rel="stylesheet" href="./modals-theme.css?v=40">
    <link rel="stylesheet" href="./ui-refinements.css?v=40">
    <link rel="stylesheet" href="./final-tweaks.css?v=40">
    <link rel="stylesheet" href="./v21-improvements.css?v=40">
    <link rel="stylesheet" href="./v23-fixes.css?v=40">
    <link rel="stylesheet" href="./v25-fixes.css?v=40">
    <link rel="stylesheet" href="./v26-fixes.css?v=40">
    <link rel="stylesheet" href="./v27-fixes.css?v=40">
    <link rel="stylesheet" href="./v29-entry-rules.css?v=40">
    <link rel="stylesheet" href="./v30-entry-rule-visibility.css?v=40">
    <link rel="stylesheet" href="./v31-dashboard.css?v=40">
</head>
<body>
    <div id="root"></div>

    <script type="module">
        const root = document.getElementById('root');
        const version = '40';

        const showStartupError = (error) => {
            console.error('Erro ao iniciar o sistema:', error);
            root.innerHTML = `
                <main style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#f8fafc;font-family:Inter,Arial,sans-serif">
                    <section style="width:100%;max-width:520px;background:white;border:1px solid #e2e8f0;border-radius:20px;padding:24px;box-shadow:0 16px 45px rgba(15,23,42,.10)">
                        <h1 style="margin:0 0 10px;color:#0f172a;font-size:22px">Não foi possível iniciar o sistema</h1>
                        <p style="margin:0 0 16px;color:#64748b;line-height:1.5">Um arquivo essencial do sistema não carregou corretamente. Atualize a página e tente novamente.</p>
                        <button onclick="location.reload()" style="border:0;border-radius:12px;background:#0f172a;color:white;font-weight:700;padding:12px 16px;width:100%">Tentar novamente</button>
                        <pre style="white-space:pre-wrap;margin:16px 0 0;padding:12px;border-radius:12px;background:#f1f5f9;color:#b91c1c;font-size:11px;overflow:auto">${String(error?.message || error || 'Erro desconhecido').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}</pre>
                    </section>
                </main>`;
        };

        const clearPreviousRuntimeCaches = async () => {
            const cleanupKey = `registro-vendas-cleanup-v${version}`;
            if (sessionStorage.getItem(cleanupKey) === 'ok') return;

            try {
                if ('serviceWorker' in navigator) {
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    await Promise.all(registrations.map(registration => registration.unregister()));
                }
                if ('caches' in window) {
                    const cacheNames = await caches.keys();
                    await Promise.all(cacheNames.map(cacheName => caches.delete(cacheName)));
                }
            } catch (cleanupError) {
                console.warn('A limpeza de cache não foi concluída, mas o sistema continuará carregando.', cleanupError);
            }

            try {
                sessionStorage.setItem(cleanupKey, 'ok');
            } catch (storageError) {
                console.warn('Não foi possível registrar a limpeza de cache.', storageError);
            }

            if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
                location.reload();
                await new Promise(() => {});
            }
        };

        const primaryModulePaths = {
            'modals': './modals-fixed.js',
            'nova-venda': './nova-venda-fixed-v39.js',
            'aba-visao-geral': './aba-visao-geral-fixed.js',
            'aba-clientes': './aba-clientes-fixed.js',
            'aba-taxas': './aba-taxas-fixed-v40.js'
        };

        const fallbackModulePaths = {
            'modals': './modals.js',
            'nova-venda': './nova-venda-fixed-v36.js',
            'aba-visao-geral': './aba-visao-geral.js',
            'aba-clientes': './aba-clientes.js',
            'aba-taxas': './aba-taxas.js'
        };

        const freshModules = [
            'modals', 'auth-admin', 'nova-venda', 'aba-visao-geral',
            'aba-vendas-prazo', 'aba-vendas-caixa', 'aba-produtos', 'aba-clientes',
            'aba-taxas', 'payment-settings', 'utils'
        ];

        const applyOptionalAppPatches = (source) => {
            let patched = source;

            const productSortingMarker = `    const sortedProducts = useMemo(() => {
        const list = [...products].sort((a, b) => a.code.localeCompare(b.code));
        if (!productSearch) return list;
        return list.filter(p => p.name.toLowerCase().includes(productSearch.toLowerCase()) || p.code.includes(productSearch));
    }, [products, productSearch]);`;

            const productSortingByStock = `    const sortedProducts = useMemo(() => {
        const compareProducts = (a, b) => {
            const aHasStock = (Number(a.quantity) || 0) > 0;
            const bHasStock = (Number(b.quantity) || 0) > 0;
            if (aHasStock !== bHasStock) return aHasStock ? -1 : 1;
            return String(a.name || '').localeCompare(String(b.name || ''), 'pt-BR', { sensitivity: 'base' });
        };
        const list = [...products].sort(compareProducts);
        if (!productSearch) return list;
        const search = productSearch.toLowerCase();
        return list.filter(p => String(p.name || '').toLowerCase().includes(search) || String(p.code || '').includes(productSearch));
    }, [products, productSearch]);`;

            if (patched.includes(productSortingMarker)) {
                patched = patched.replace(productSortingMarker, productSortingByStock);
            } else {
                const productSortingPattern = /    const sortedProducts = useMemo\(\(\) => \{[\s\S]*?    \}, \[products, productSearch\]\);/;
                if (productSortingPattern.test(patched)) {
                    patched = patched.replace(productSortingPattern, productSortingByStock);
                } else {
                    console.warn('Ordenação preferencial por estoque não pôde ser aplicada; mantendo ordenação original.');
                }
            }

            patched = patched.replace(
                "title: installmentListModal.type === 'overdue' ? 'Parcelas em atraso' : 'Vencendo em 7 dias'",
                "title: installmentListModal.type === 'overdue' ? 'Parcelas em atraso' : installmentListModal.type === 'today' ? 'Parcelas vencendo hoje' : 'Parcelas a vencer nos próximos 7 dias'"
            );

            return patched;
        };

        const rewriteModuleImports = (source, modulePaths) => source.replace(
            /(['"])(\.\/[^'"]+?\.js)(?:\?[^'"]*)?\1/g,
            (match, quote, modulePath) => {
                const moduleName = modulePath.split('/').pop().replace(/\.js$/, '');
                const resolvedModulePath = modulePaths[moduleName] || modulePath;
                const moduleUrl = new URL(resolvedModulePath, location.href);
                if (freshModules.includes(moduleName)) moduleUrl.search = `?v=${version}`;
                return `'${moduleUrl.href}'`;
            }
        );

        const importAppSource = async (source) => {
            const appBlobUrl = URL.createObjectURL(new Blob([source], { type: 'text/javascript' }));
            try {
                await import(appBlobUrl);
            } finally {
                URL.revokeObjectURL(appBlobUrl);
            }
        };

        try {
            await clearPreviousRuntimeCaches();

            const appResponse = await fetch(`./app.js?v=${version}`, { cache: 'no-store' });
            if (!appResponse.ok) throw new Error(`Falha ao carregar app.js (${appResponse.status})`);
            const rawAppSource = await appResponse.text();
            const optionalPatchedSource = applyOptionalAppPatches(rawAppSource);

            try {
                const primarySource = rewriteModuleImports(optionalPatchedSource, primaryModulePaths);
                await importAppSource(primarySource);
            } catch (primaryError) {
                console.error('Falha ao carregar melhorias mais recentes. Tentando configuração estável.', primaryError);
                try {
                    const fallbackSource = rewriteModuleImports(rawAppSource, fallbackModulePaths);
                    await importAppSource(fallbackSource);
                } catch (fallbackError) {
                    console.error('Configuração estável também falhou. Tentando módulos originais.', fallbackError);
                    const emergencySource = rewriteModuleImports(rawAppSource, {});
                    await importAppSource(emergencySource);
                }
            }

            try {
                await import(`./tab-persistence.js?v=${version}`);
            } catch (persistenceError) {
                console.warn('A persistência da aba não carregou; o sistema continuará funcionando.', persistenceError);
            }
        } catch (error) {
            showStartupError(error);
        }
    </script>
</body>
</html>
