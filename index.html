<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Registro de Vendas</title>

    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Vendas App">

    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" href="./favicon.png">
    <link rel="apple-touch-icon" href="./icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./styles.css?v=10">
    <link rel="stylesheet" href="./modals-theme.css?v=2">
    <link rel="stylesheet" href="./ui-refinements.css?v=2">
    <link rel="stylesheet" href="./final-tweaks.css?v=1">
</head>
<body>
    <div id="root"></div>

    <script type="module">
        const root = document.getElementById('root');

        const showStartupError = (error) => {
            console.error('Erro ao iniciar o sistema:', error);
            root.innerHTML = `
                <main style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#f8fafc;font-family:Inter,Arial,sans-serif">
                    <section style="width:100%;max-width:520px;background:white;border:1px solid #e2e8f0;border-radius:20px;padding:24px;box-shadow:0 16px 45px rgba(15,23,42,.10)">
                        <h1 style="margin:0 0 10px;color:#0f172a;font-size:22px">Não foi possível iniciar o sistema</h1>
                        <p style="margin:0 0 16px;color:#64748b;line-height:1.5">Um arquivo do sistema não carregou corretamente. Atualize a página. Se continuar, confira se todos os arquivos do pacote foram colocados na mesma pasta do <strong>index.html</strong>.</p>
                        <button onclick="location.reload()" style="border:0;border-radius:12px;background:#0f172a;color:white;font-weight:700;padding:12px 16px;width:100%">Tentar novamente</button>
                        <pre style="white-space:pre-wrap;margin:16px 0 0;padding:12px;border-radius:12px;background:#f1f5f9;color:#b91c1c;font-size:11px;overflow:auto">${String(error?.message || error || 'Erro desconhecido').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}</pre>
                    </section>
                </main>`;
        };

        try {
            const cleanupKey = 'registro-vendas-cleanup-v10';
            if (sessionStorage.getItem(cleanupKey) !== 'ok') {
                if ('serviceWorker' in navigator) {
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    await Promise.all(registrations.map(registration => registration.unregister()));
                }
                if ('caches' in window) {
                    const cacheNames = await caches.keys();
                    await Promise.all(cacheNames.map(cacheName => caches.delete(cacheName)));
                }
                sessionStorage.setItem(cleanupKey, 'ok');

                if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
                    location.reload();
                    await new Promise(() => {});
                }
            }

            const version = '10';
            await Promise.all([
                './utils.js', './nova-venda.js', './modals.js', './auth-admin.js',
                './aba-clientes.js', './app-resilience.js', './app-resilience-fixes.js'
            ].map(path => fetch(`${path}?refresh=${version}`, { cache: 'reload' }).catch(() => null)));

            const appResponse = await fetch(`./app.js?v=${version}`, { cache: 'no-store' });
            if (!appResponse.ok) throw new Error(`Falha ao carregar app.js (${appResponse.status})`);

            let appSource = await appResponse.text();
            const freshModules = [
                'modals', 'auth-admin', 'nova-venda', 'aba-visao-geral',
                'aba-vendas-prazo', 'aba-vendas-caixa', 'aba-produtos', 'aba-clientes',
                'utils', 'draft-storage'
            ];

            appSource = appSource.replace(
                /(['"])(\.\/[^'"]+?\.js)(?:\?[^'"]*)?\1/g,
                (match, quote, modulePath) => {
                    const moduleName = modulePath.split('/').pop().replace(/\.js$/, '');
                    const moduleUrl = new URL(modulePath, location.href);
                    if (freshModules.includes(moduleName)) moduleUrl.search = `?v=${version}`;
                    return `'${moduleUrl.href}'`;
                }
            );

            const appBlobUrl = URL.createObjectURL(new Blob([appSource], { type: 'text/javascript' }));
            try {
                await import(appBlobUrl);
                await import('./app-resilience.js?v=2');
                await import('./app-resilience-fixes.js?v=1');
            } finally {
                URL.revokeObjectURL(appBlobUrl);
            }
        } catch (error) {
            showStartupError(error);
        }
    </script>
</body>
</html>
